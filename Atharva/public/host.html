<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz Host</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .pin {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      text-align: center;
      margin: 20px 0;
    }

    .question {
      font-size: 26px;
      font-weight: bold;
    }

    .option {
      padding: 15px;
      margin: 8px 0;
      background: #f1f3f5;
      border-radius: 8px;
    }

    #timer {
      font-size: 35px;
      font-weight: bold;
      text-align: center;
    }

    li {
      padding: 8px;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>👑 Quiz Host</h1>

    <input
      id="hostName"
      placeholder="Host Name"
    >

    <input
      id="category"
      placeholder="Quiz Category"
      value="Technology"
    >

    <button onclick="createQuiz()">
      Create Quiz
    </button>

    <div id="pinSection" class="hidden">

      <p>Share this PIN with players:</p>

      <div class="pin" id="pin"></div>

      <h2>Players</h2>

      <ul id="players"></ul>

      <button id="startButton" onclick="startQuiz()">
        Start Game
      </button>

    </div>

  </div>


  <div id="gameSection" class="card hidden">

    <h2 id="questionNumber"></h2>

    <div id="question" class="question"></div>

    <div id="options"></div>

    <div id="timer">
      15
    </div>

    <p id="answerInfo"></p>

  </div>


  <div id="leaderboardSection" class="card hidden">

    <h2>🏆 Leaderboard</h2>

    <ol id="leaderboard"></ol>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>

  const socket = io();

  let quizPin = "";

  function createQuiz() {

    const hostName =
      document.getElementById("hostName").value.trim();

    const category =
      document.getElementById("category").value.trim();

    if (!hostName) {
      alert("Enter host name.");
      return;
    }

    socket.emit("quiz:create", {
      hostName,
      category
    });
  }

  socket.on("quiz:created", (data) => {

    quizPin = data.pin;

    document.getElementById("pin").textContent =
      data.pin;

    document
      .getElementById("pinSection")
      .classList.remove("hidden");
  });


  function startQuiz() {

    socket.emit("quiz:start", {
      pin: quizPin
    });

    socket.emit("quiz:started", {
      pin: quizPin
    });
  }


  socket.on("quiz:started", () => {

    document
      .getElementById("gameSection")
      .classList.remove("hidden");

    document.getElementById("startButton").disabled = true;
  });


  socket.on("lobby:update", (data) => {

    const players =
      document.getElementById("players");

    players.innerHTML = "";

    data.players.forEach((player) => {

      const li = document.createElement("li");

      li.textContent =
        `${player.name} — ${player.score} points`;

      players.appendChild(li);

    });
  });


  socket.on("question:start", (data) => {

    document.getElementById("questionNumber")
      .textContent =
      `Question ${data.questionIndex} / ${data.totalQuestions}`;

    document.getElementById("question")
      .textContent = data.question;

    const options =
      document.getElementById("options");

    options.innerHTML = "";

    data.options.forEach((option, index) => {

      const div =
        document.createElement("div");

      div.className = "option";

      div.textContent =
        `${index + 1}. ${option}`;

      options.appendChild(div);

    });

    startTimer(data.timeLimitSeconds);

  });


  function startTimer(seconds) {

    let remaining = seconds;

    const timer =
      document.getElementById("timer");

    timer.textContent =
      `${remaining}s`;

    const interval =
      setInterval(() => {

        remaining--;

        timer.textContent =
          `${remaining}s`;

        if (remaining <= 0) {
          clearInterval(interval);
        }

      }, 1000);
  }


  socket.on("question:time_up", (data) => {

    document.getElementById("answerInfo")
      .textContent =
      `Correct Answer: Option ${data.correctOption + 1} — ${data.explanation}`;

  });


  socket.on("leaderboard:update", (data) => {

    document
      .getElementById("leaderboardSection")
      .classList.remove("hidden");

    const leaderboard =
      document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    data.leaderboard.forEach((player) => {

      const li =
        document.createElement("li");

      li.textContent =
        `${player.rank}. ${player.name} — ${player.score}`;

      leaderboard.appendChild(li);

    });

  });


  socket.on("quiz:ended", (data) => {

    alert(
      `🏆 Winner: ${data.winner.name} with ${data.winner.score} points!`
    );

  });


  socket.on("error:message", (message) => {
    alert(message);
  });

</script>

</body>
</html>
