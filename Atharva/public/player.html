<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Quiz Player</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #joinButton {
      background: #4f46e5;
    }

    .answer {
      background: #2563eb;
    }

    .answer:nth-child(2) {
      background: #dc2626;
    }

    .answer:nth-child(3) {
      background: #16a34a;
    }

    .answer:nth-child(4) {
      background: #9333ea;
    }

    #timer {
      text-align: center;
      font-size: 40px;
      font-weight: bold;
      margin: 15px;
    }

    #question {
      font-size: 25px;
      font-weight: bold;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .score {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    li {
      padding: 8px;
      font-size: 18px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="card" id="joinCard">

    <h1>🎯 Join Quiz</h1>

    <input
      id="playerName"
      placeholder="Your Name"
    >

    <input
      id="pin"
      placeholder="4-Digit PIN"
      maxlength="4"
    >

    <button
      id="joinButton"
      onclick="joinQuiz()"
    >
      Join Quiz
    </button>

  </div>


  <div
    class="card hidden"
    id="gameCard"
  >

    <p id="questionNumber"></p>

    <div id="question"></div>

    <div id="timer">
      15s
    </div>

    <div id="answers"></div>

    <p
      class="score"
      id="score"
    >
      Score: 0
    </p>

    <p id="result"></p>

  </div>


  <div
    class="card hidden"
    id="leaderboardCard"
  >

    <h2>🏆 Leaderboard</h2>

    <ol id="leaderboard"></ol>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

  const socket = io();

  let quizPin = "";
  let questionStartTime = 0;
  let answered = false;
  let currentScore = 0;


  function joinQuiz() {

    const playerName =
      document
        .getElementById("playerName")
        .value
        .trim();

    quizPin =
      document
        .getElementById("pin")
        .value
        .trim();

    if (!playerName || !quizPin) {
      alert("Enter your name and quiz PIN.");
      return;
    }

    socket.emit("quiz:join", {
      pin: quizPin,
      playerName
    });

  }


  socket.on("quiz:joined", () => {

    document
      .getElementById("joinCard")
      .classList.add("hidden");

    document
      .getElementById("gameCard")
      .classList.remove("hidden");

  });


  socket.on("quiz:started", () => {

    document
      .getElementById("result")
      .textContent =
      "Game started! Get ready...";

  });


  socket.on("question:start", (data) => {

    answered = false;

    questionStartTime = Date.now();

    document
      .getElementById("questionNumber")
      .textContent =
      `Question ${data.questionIndex} / ${data.totalQuestions}`;

    document
      .getElementById("question")
      .textContent =
      data.question;

    const answers =
      document.getElementById("answers");

    answers.innerHTML = "";

    data.options.forEach((option, index) => {

      const button =
        document.createElement("button");

      button.className = "answer";

      button.textContent = option;

      button.onclick = () => submitAnswer(index);

      answers.appendChild(button);

    });

    startTimer(data.timeLimitSeconds);

    document.getElementById("result")
      .textContent = "";

  });


  function startTimer(seconds) {

    let remaining = seconds;

    const timer =
      document.getElementById("timer");

    timer.textContent =
      `${remaining}s`;

    const interval =
      setInterval(() => {

        remaining--;

        timer.textContent =
          `${remaining}s`;

        if (remaining <= 0) {

          clearInterval(interval);

          disableAnswers();

        }

      }, 1000);

  }


  function submitAnswer(selectedOption) {

    if (answered) {
      return;
    }

    answered = true;

    const timeTakenMs =
      Date.now() - questionStartTime;

    socket.emit("answer:submit", {
      pin: quizPin,
      selectedOption,
      timeTakenMs
    });

    disableAnswers();

  }


  function disableAnswers() {

    document
      .querySelectorAll(".answer")
      .forEach((button) => {
        button.disabled = true;
      });

  }


  socket.on("answer:result", (data) => {

    currentScore = data.totalScore;

    document
      .getElementById("score")
      .textContent =
      `Score: ${currentScore}`;

    if (data.correct) {

      document
        .getElementById("result")
        .textContent =
        `✅ Correct! +${data.score} points`;

    } else {

      document
        .getElementById("result")
        .textContent =
        "❌ Wrong answer!";

    }

  });


  socket.on("question:time_up", (data) => {

    document
      .getElementById("result")
      .textContent =
      `Time up! Correct answer: Option ${data.correctOption + 1}`;

    disableAnswers();

  });


  socket.on("leaderboard:update", (data) => {

    document
      .getElementById("leaderboardCard")
      .classList.remove("hidden");

    const leaderboard =
      document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    data.leaderboard.forEach((player) => {

      const li =
        document.createElement("li");

      li.textContent =
        `${player.rank}. ${player.name} — ${player.score}`;

      leaderboard.appendChild(li);

    });

  });


  socket.on("quiz:ended", (data) => {

    document
      .getElementById("result")
      .textContent =
      `🏆 Winner: ${data.winner.name}`;

  });


  socket.on("error:message", (message) => {
    alert(message);
  });

</script>

</body>

</html>
